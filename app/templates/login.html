<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar - ZapBudget</title>
    <link rel="icon" type="image/png" href="./img/favicon (3).png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }
        
        button {
            min-height: 54px;
        }

        .auth-card {
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .google-btn {
            background: white;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            transition: all 0.2s;
        }
        .google-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen flex flex-col items-center justify-center p-6">

    <a href="/" class="absolute top-8 left-6 md:left-12 flex items-center gap-2 text-sm font-bold text-slate-400 hover:text-slate-900 transition-all group">
        <i data-lucide="arrow-left" class="w-4 h-4 group-hover:-translate-x-1 transition-transform"></i> 
        Voltar
    </a>

    <div class="w-full max-w-md space-y-8 auth-card">
        <div class="text-center">
            <div class="bg-green-600 w-16 h-16 rounded-2xl text-white flex items-center justify-center mx-auto mb-6 shadow-xl shadow-green-100">
                <i data-lucide="zap" class="w-8 h-8 fill-current"></i>
            </div>
            <h2 id="auth-title" class="text-3xl font-black text-slate-900 tracking-tight uppercase">Começar 7 Dias Grátis</h2>
            <p id="auth-subtitle" class="text-slate-500 mt-3 font-medium px-4">Crie sua conta em segundos para enviar este orçamento e profissionalizar seu negócio.</p>
        </div>

        <div class="bg-white p-8 rounded-[40px] border border-slate-200 shadow-2xl shadow-slate-200/40">
            
            <button onclick="handleGoogleLogin()" class="w-full google-btn font-bold py-4 rounded-2xl flex items-center justify-center gap-3 mb-6 active:scale-95 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continuar com Google
            </button>

            <div class="relative flex items-center gap-4 mb-6">
                <div class="flex-1 h-px bg-slate-100"></div>
                <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">ou e-mail</span>
                <div class="flex-1 h-px bg-slate-100"></div>
            </div>

            <form onsubmit="handleAuth(event)" class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Seu E-mail</label>
                    <input type="email" id="auth-email" required placeholder="exemplo@gmail.com" class="w-full p-4 rounded-xl border border-slate-100 bg-slate-50 font-bold text-slate-700 transition-all">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Sua Senha</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full p-4 rounded-xl border border-slate-100 bg-slate-50 font-bold text-slate-700 transition-all">
                </div>

                <button type="submit" id="auth-btn" class="w-full bg-green-600 text-white font-black py-4 rounded-2xl text-lg hover:bg-green-700 transition-all shadow-xl shadow-green-100 active:scale-95 flex items-center justify-center gap-2 mt-2">
                    ATIVAR TESTE GRATUITO
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="/" class="text-sm font-bold text-slate-400 hover:text-slate-600 transition-colors">Talvez mais tarde</a>
            </div>
        </div>
        
        <div class="text-center space-y-4">
            <p class="text-[10px] font-black tracking-[0.3em] uppercase opacity-20 text-slate-950">
                Segurança Garantida ZapBudget
            </p>
        </div>
    </div>

    <script>
        // Configurações do Supabase extraídas do seu projeto
        const SUPABASE_URL = "https://oqafestnsewmigjeozeh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lQh9j9TlA3-7S35jqFjefA_fh4sswez";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        lucide.createIcons();

        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById('auth-btn');
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            // Início do feedback real de carregamento
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> AUTENTICANDO...`;
            lucide.createIcons();

            try {
                // Tenta realizar o login
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    // Se o login falhar, tenta registrar um novo utilizador para o Trial
                    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                    });

                    if (signUpError) throw signUpError;
                    
                    btn.classList.replace('bg-green-600', 'bg-slate-900');
                    btn.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> CONTA CRIADA!`;
                } else {
                    btn.classList.replace('bg-green-600', 'bg-slate-900');
                    btn.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> BEM-VINDO!`;
                }

                lucide.createIcons();
                
                // Redireciona após o feedback de sucesso
                setTimeout(() => {
                    window.location.href = "/"; 
                }, 800);

            } catch (err) {
                console.error("Erro na autenticação:", err.message);
                alert("Erro: " + err.message);
                
                // Reseta o botão em caso de falha para permitir nova tentativa
                btn.disabled = false;
                btn.innerHTML = `ATIVAR TESTE GRATUITO`;
                lucide.createIcons();
            }
        }

        async function handleGoogleLogin() {
            try {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/'
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert("Erro ao conectar com Google: " + err.message);
            }
        }
    </script>
</body>
</html>
