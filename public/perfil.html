<!DOCTYPE html>
<html lang="pt-br" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light only">
    <meta name="theme-color" content="#ffffff">
    
    <title>ZapBudget - Meu Perfil</title>
    <link rel="icon" type="image/png" href="/img/favicon (3).png">
    <link rel="manifest" href="/manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        green: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root { color-scheme: light only; }

        html, body {
            background-color: #ffffff !important;
            color: #0f172a !important;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Bloqueio de Dark Mode */
        @media (prefers-color-scheme: dark) {
            body, html { background-color: #ffffff !important; color: #0f172a !important; }
            .bg-white { background-color: #ffffff !important; }
            .text-slate-900 { color: #0f172a !important; }
        }

        button { min-height: 56px; }

        #toast-container {
            position: fixed;
            top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: 90%; max-width: 400px; pointer-events: none;
        }
        .toast {
            background: white; padding: 16px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
            animation: toastIn 0.3s ease-out forwards; pointer-events: auto;
            border-left: 4px solid #16a34a;
        }
        .toast.error { border-left-color: #ef4444; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
    </style>
</head>
<body class="bg-white text-slate-900 flex flex-col">

    <div id="toast-container"></div>

    <nav class="bg-white/95 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center">
                <a href="index.html" class="flex items-center gap-2 group">
                    <div class="bg-green-600 p-1.5 rounded-lg text-white group-hover:bg-green-700 transition-colors">
                        <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
                    </div>
                    <span class="font-bold text-lg tracking-tight">Zap<span class="text-green-600">Budget</span></span>
                </a>
            </div>

            <div class="flex items-center gap-8">
                <div class="hidden lg:flex items-center gap-6">
                    <a href="app.html" class="text-sm font-bold text-slate-500 hover:text-green-600 transition-colors flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Novo
                    </a>
                    <a href="historico.html" class="text-sm font-bold text-slate-500 hover:text-green-600 transition-colors flex items-center gap-2">
                        <i data-lucide="history" class="w-4 h-4"></i> Histórico
                    </a>
                    <a href="perfil.html" class="text-sm font-bold text-green-600 hover:text-green-700 transition-colors flex items-center gap-2">
                        <i data-lucide="user" class="w-4 h-4"></i> Perfil
                    </a>
                </div>
                <div class="hidden lg:block w-px h-6 bg-slate-200"></div>
                <div id="user-nav" class="flex items-center gap-4"></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8 pb-32 lg:py-12">
        
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Meu Perfil</h1>
            <p class="text-slate-500 font-medium">Gerencie suas informações e assinatura.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8">
            
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white rounded-3xl p-6 shadow-xl shadow-slate-100 border border-slate-100 relative overflow-hidden">
                    <div class="flex items-center gap-4 mb-6">
                        <div id="profile-avatar" class="h-20 w-20 bg-green-600 rounded-full flex items-center justify-center text-3xl font-bold text-white shadow-lg ring-4 ring-green-50">
                            </div>
                        <div>
                            <h2 id="profile-name" class="text-xl font-bold text-slate-900">Carregando...</h2>
                            <p class="text-sm text-slate-400 font-medium">Membro ZapBudget</p>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-widest">Método de Acesso</label>
                            <div id="profile-provider" class="text-sm font-semibold text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center gap-2">
                                <span class="animate-pulse w-20 h-4 bg-slate-200 rounded"></span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-widest">Email da Conta</label>
                            <div id="profile-email" class="text-sm font-semibold text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                ...
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-widest">CPF Vinculado</label>
                            <div id="profile-cpf-container">
                                <div class="text-sm font-semibold text-slate-400 bg-slate-50 p-3 rounded-xl border border-slate-100 animate-pulse">
                                    Carregando...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <button onclick="handleLogout()" class="w-full bg-white border border-red-100 text-red-500 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 hover:bg-red-50 transition-all shadow-sm">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Sair da Conta
                </button>
            </div>

            <div class="md:col-span-1 space-y-6">
                
                <div id="plan-card" class="bg-white rounded-3xl p-6 shadow-xl shadow-slate-100 border border-slate-100 h-full flex flex-col relative overflow-hidden">
                    <div class="animate-pulse flex flex-col gap-4">
                        <div class="h-6 w-1/2 bg-slate-100 rounded"></div>
                        <div class="h-20 w-full bg-slate-100 rounded"></div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="hidden lg:block bg-slate-900 text-slate-500 pt-12 pb-24 lg:pb-12 mt-auto border-t border-white/5">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div class="flex items-center justify-center gap-2 mb-6">
                <i data-lucide="zap" class="w-5 h-5 text-green-500 fill-current"></i>
                <span class="font-black text-white text-xl uppercase italic">Zap<span class="text-green-600">Budget</span></span>
            </div>
            <p class="text-xs font-bold opacity-40 uppercase tracking-widest">© 2026 ZapBudget SaaS</p>
        </div>
    </footer>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 h-16 flex items-center justify-around z-[60] lg:hidden">
        <button onclick="location.href='app.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-green-600 transition-colors">
            <i data-lucide="plus-circle" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Novo</span>
        </button>
        <button onclick="window.location.href='historico.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-green-600 transition-colors">
            <i data-lucide="history" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Histórico</span>
        </button>
        <button onclick="window.location.href='perfil.html'" class="flex flex-col items-center gap-1 text-green-600">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Perfil</span>
        </button>
    </div>

    <script>
        const SUPABASE_URL = "https://pxwsebtpmghhgbigkddx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lQh9j9TlA3-7S35jqFjefA_fh4sswez";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        lucide.createIcons();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            const icon = type === 'error' ? 'alert-circle' : 'check-circle';
            const color = type === 'error' ? 'text-red-500' : 'text-green-500';
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 ${color}"></i><span class="text-sm font-bold text-slate-700">${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function maskCpf(cpf) {
            if (!cpf) return '';
            const clean = cpf.replace(/\D/g, '');
            if (clean.length !== 11) return cpf;
            return clean.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.***.***-$4');
        }

        async function saveCpf() {
            const newCpf = document.getElementById('input-cpf').value;
            if (!newCpf || newCpf.length < 11) {
                showToast("Digite um CPF válido (apenas números).", "error");
                return;
            }

            const saveBtn = document.getElementById('btn-save-cpf');
            const originalText = saveBtn.innerText;
            saveBtn.innerText = "...";
            saveBtn.disabled = true;

            const { error } = await supabaseClient
                .from('profiles')
                .update({ cpf: newCpf })
                .eq('id', currentUser.id);

            if (error) {
                console.error(error);
                showToast("Erro ao salvar CPF.", "error");
                saveBtn.innerText = originalText;
                saveBtn.disabled = false;
            } else {
                showToast("CPF salvo com sucesso!");
                loadProfile();
            }
        }

        async function loadProfile() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    window.location.replace("login.html");
                    return;
                }
                currentUser = session.user;

                const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
                document.getElementById('profile-name').innerText = name;
                document.getElementById('profile-email').innerText = currentUser.email;
                document.getElementById('profile-avatar').innerText = name.charAt(0).toUpperCase();

                const provider = currentUser.app_metadata.provider;
                const providerEl = document.getElementById('profile-provider');
                if (provider === 'google') {
                    providerEl.innerHTML = `<i data-lucide="globe" class="w-4 h-4 text-blue-500"></i> Conta Google`;
                } else {
                    providerEl.innerHTML = `<i data-lucide="mail" class="w-4 h-4 text-slate-500"></i> Cadastro Manual`;
                }

                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();

                if (profile) {
                    const cpfContainer = document.getElementById('profile-cpf-container');
                    if (profile.cpf) {
                        const masked = maskCpf(profile.cpf);
                        cpfContainer.innerHTML = `
                            <div class="text-sm font-semibold text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center justify-between">
                                <span>${masked}</span>
                                <i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i>
                            </div>
                        `;
                    } else {
                        cpfContainer.innerHTML = `
                            <div class="flex gap-2">
                                <input type="text" id="input-cpf" placeholder="Digite seu CPF" class="w-full bg-white border border-yellow-300 ring-2 ring-yellow-50 rounded-xl p-3 text-sm font-medium focus:outline-none focus:border-yellow-500 transition-all" maxlength="11">
                                <button id="btn-save-cpf" onclick="saveCpf()" class="bg-slate-900 text-white px-4 rounded-xl text-xs font-bold hover:bg-slate-800 transition-colors shadow-lg">
                                    SALVAR
                                </button>
                            </div>
                            <p class="text-[10px] text-yellow-600 font-bold mt-1 ml-1 flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Necessário para nota fiscal</p>
                        `;
                    }

                    const planCard = document.getElementById('plan-card');
                    const isPro = profile.is_premium;
                    
                    if (isPro) {
                        planCard.innerHTML = `
                            <div class="absolute top-0 right-0 p-4 opacity-10">
                                <i data-lucide="crown" class="w-32 h-32 text-slate-900"></i>
                            </div>
                            <div class="relative z-10 flex flex-col h-full justify-between">
                                <div>
                                    <span class="bg-slate-900 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Plano Ativo</span>
                                    <h3 class="text-2xl font-black text-slate-900 mt-4 uppercase">Membro PRO <i data-lucide="crown" class="inline w-6 h-6 text-yellow-500 fill-current"></i></h3>
                                    <p class="text-sm text-slate-500 mt-2 font-medium">Você tem acesso ilimitado a todos os recursos.</p>
                                </div>
                                <div class="mt-6 pt-6 border-t border-slate-100">
                                    <ul class="space-y-2 text-sm font-bold text-slate-700">
                                        <li class="flex items-center gap-2"><i data-lucide="check" class="w-4 h-4 text-green-500"></i> Orçamentos Ilimitados</li>
                                        <li class="flex items-center gap-2"><i data-lucide="check" class="w-4 h-4 text-green-500"></i> Sem marca d'água</li>
                                    </ul>
                                </div>
                            </div>
                        `;
                    } else {
                        const trialStart = new Date(profile.trial_start);
                        const now = new Date();
                        const diffTime = now - trialStart; 
                        const daysPassed = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                        const daysLeft = Math.max(0, 7 - daysPassed);
                        const isExpired = daysPassed >= 7;

                        if (isExpired) {
                            planCard.innerHTML = `
                                <div class="absolute inset-0 bg-red-50"></div>
                                <div class="relative z-10 flex flex-col h-full justify-between">
                                    <div>
                                        <span class="bg-red-500 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Expirado</span>
                                        <h3 class="text-2xl font-black text-red-900 mt-4">Trial Expirado</h3>
                                        <p class="text-sm text-red-700 mt-2 font-bold">Assine para continuar enviando.</p>
                                    </div>
                                    <button onclick="goToStripe()" class="mt-6 w-full bg-red-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95">Desbloquear Agora</button>
                                </div>
                            `;
                        } else {
                            const progress = Math.min(100, (daysPassed / 7) * 100);
                            planCard.innerHTML = `
                                <div class="relative z-10 flex flex-col h-full justify-between">
                                    <div>
                                        <span class="bg-orange-100 text-orange-600 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Plano Gratuito</span>
                                        <h3 class="text-2xl font-black text-slate-900 mt-4">Período Trial</h3>
                                        <div class="mt-4">
                                            <div class="flex justify-between items-end mb-1">
                                                <span class="text-4xl font-black text-green-600">${daysLeft}</span>
                                                <span class="text-xs font-bold text-slate-400 uppercase mb-1">Dias restantes</span>
                                            </div>
                                            <div class="w-full bg-slate-100 rounded-full h-2">
                                                <div class="bg-green-500 h-2 rounded-full" style="width: ${100 - progress}%"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <button onclick="goToStripe()" class="mt-8 w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95">Fazer Upgrade</button>
                                </div>
                            `;
                        }
                    }
                    lucide.createIcons();
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function handleLogout() {
            try { await supabaseClient.auth.signOut(); } 
            finally { window.location.replace("login.html"); }
        }

        function goToStripe() { window.open("https://buy.stripe.com/5kQ9AUc1W6280O26VN9Zm01", "_blank"); }

        loadProfile();
    </script>
</body>
</html>
