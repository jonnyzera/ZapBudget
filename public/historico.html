<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meus Orçamentos - ZapBudget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            padding-bottom: 90px;
        }

        .budget-card {
            transition: all 0.2s ease;
        }
        .budget-card:active {
            transform: scale(0.98);
        }

        /* Skeleton loader animation */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="text-slate-900">

    <!-- NAV SUPERIOR -->
    <nav class="bg-white/70 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-green-600 p-1.5 rounded-lg text-white">
                    <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
                </div>
                <span class="font-bold text-lg tracking-tight">Zap<span class="text-green-600">Budget</span></span>
            </div>
            <div id="user-info" class="text-xs font-bold text-slate-400 uppercase tracking-widest">
                Carregando...
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">Histórico</h1>
                <p class="text-slate-500 font-medium">Todos os seus orçamentos gerados.</p>
            </div>
            <a href="site.html" class="bg-green-600 text-white p-3 rounded-2xl shadow-lg shadow-green-100 active:scale-95 transition-all">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </a>
        </header>

        <!-- STATUS DE ASSINATURA -->
        <div id="status-card" class="mb-6 hidden">
            <div class="bg-slate-900 rounded-[24px] p-5 text-white flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="bg-yellow-400 p-2 rounded-xl text-slate-900">
                        <i data-lucide="crown" class="w-5 h-5 fill-current"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-black uppercase tracking-widest opacity-60">Status da Conta</p>
                        <p id="account-status-text" class="font-bold">Usuário Trial (7 dias)</p>
                    </div>
                </div>
                <button onclick="window.location.href='#'" class="text-xs font-black bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full transition-all uppercase tracking-tighter">
                    Upgrade
                </button>
            </div>
        </div>

        <!-- LISTA DE ORÇAMENTOS -->
        <div id="budget-list" class="space-y-4">
            <!-- Skeleton Loaders -->
            <div class="skeleton h-24 w-full rounded-3xl"></div>
            <div class="skeleton h-24 w-full rounded-3xl"></div>
            <div class="skeleton h-24 w-full rounded-3xl"></div>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION (PWA Mobile) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 h-16 flex items-center justify-around z-[60] lg:hidden no-print">
        <a href="site.html" class="flex flex-col items-center gap-1 text-slate-400">
            <i data-lucide="plus-circle" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Novo</span>
        </a>
        <a href="historico.html" class="flex flex-col items-center gap-1 text-green-600">
            <i data-lucide="history" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Histórico</span>
        </a>
        <button onclick="alert('Funcionalidade Premium em breve!')" class="flex flex-col items-center gap-1 text-slate-400">
            <i data-lucide="crown" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Pro</span>
        </button>
    </div>

    <script>
        // CONFIGURAÇÕES SUPABASE
        const SUPABASE_URL = "https://oqafestnsewmigjeozeh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_hR1cOLUTK0is6yOiNfWnKQ_5xz7bDXI";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;

        lucide.createIcons();

        // 1. VERIFICAR LOGIN
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = "site.html"; // Redireciona se não estiver logado
                return;
            }
            currentUser = session.user;
            document.getElementById('user-info').innerText = currentUser.email.split('@')[0];
            
            await Promise.all([
                loadProfileStatus(),
                loadBudgets()
            ]);
        }

        // 2. CARREGAR STATUS DO TRIAL/PREMIUM
        async function loadProfileStatus() {
            const { data: profile } = await supabase
                .table('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (profile) {
                const statusCard = document.getElementById('status-card');
                const statusText = document.getElementById('account-status-text');
                statusCard.classList.remove('hidden');

                if (profile.is_premium) {
                    statusText.innerText = "Assinante Pro Ativo";
                } else {
                    // Calcular dias restantes
                    const trialStart = new Date(profile.trial_start);
                    const hoje = new Date();
                    const diffTime = Math.abs(hoje - trialStart);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    const restantes = 7 - diffDays;
                    statusText.innerText = restantes > 0 ? `Trial: ${restantes} dias restantes` : "Período Trial Expirado";
                }
            }
        }

        // 3. CARREGAR ORÇAMENTOS
        async function loadBudgets() {
            const container = document.getElementById('budget-list');
            
            const { data: budgets, error } = await supabase
                .table('orçamentos')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-center text-red-500 font-bold p-10">Erro ao carregar dados.</p>`;
                return;
            }

            if (budgets.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-[40px] border border-slate-100">
                        <i data-lucide="folder-open" class="w-12 h-12 text-slate-200 mx-auto mb-4"></i>
                        <p class="text-slate-400 font-bold">Nenhum orçamento encontrado.</p>
                        <a href="site.html" class="text-green-600 font-black text-xs uppercase mt-4 block tracking-widest">Criar meu primeiro</a>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = budgets.map(b => `
                <div class="budget-card bg-white p-5 rounded-[28px] border border-slate-100 shadow-sm flex items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="bg-slate-50 w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400">
                            <i data-lucide="file-text" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h4 class="font-black text-slate-900 truncate max-w-[150px] sm:max-w-none">${b.client_name || 'Cliente sem nome'}</h4>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">
                                ${new Date(b.created_at).toLocaleDateString('pt-BR')} • ${b.valor}
                            </p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="copyLink('${b.id}')" class="bg-slate-50 text-slate-600 p-3 rounded-xl hover:bg-green-50 hover:text-green-600 transition-all">
                            <i data-lucide="share-2" class="w-5 h-5"></i>
                        </button>
                        <a href="view.html?id=${b.id}" target="_blank" class="bg-slate-900 text-white p-3 rounded-xl shadow-lg active:scale-90 transition-all">
                            <i data-lucide="external-link" class="w-5 h-5"></i>
                        </a>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function copyLink(id) {
            const link = `https://zapbudget.site/view.html?id=${id}`;
            const tempInput = document.createElement("input");
            tempInput.value = link;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("Link copiado para a área de transferência!");
        }

        checkAuth();
    </script>
</body>
</html>
