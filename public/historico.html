<!DOCTYPE html>
<html lang="pt-br" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light only">
    <meta name="theme-color" content="#ffffff">
    
    <title>ZapBudget - Histórico</title>
    <link rel="icon" type="image/png" href="/img/favicon (3).png">
    <link rel="manifest" href="/manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        green: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root { color-scheme: light only; }

        html, body {
            background-color: #ffffff !important;
            color: #0f172a !important;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Bloqueio de Dark Mode */
        @media (prefers-color-scheme: dark) {
            body, html { background-color: #ffffff !important; color: #0f172a !important; }
            .bg-white { background-color: #ffffff !important; }
            .text-slate-900 { color: #0f172a !important; }
        }

        button { min-height: 56px; }

        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #toast-container {
            position: fixed;
            top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: 90%; max-width: 400px; pointer-events: none;
        }
        .toast {
            background: white; padding: 16px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
            animation: toastIn 0.3s ease-out forwards; pointer-events: auto;
            border-left: 4px solid #16a34a;
        }
        .toast.error { border-left: 4px solid #ef4444; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
    </style>
</head>
<body class="bg-white text-slate-900 flex flex-col">

    <div id="toast-container"></div>

    <nav class="bg-white/95 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center">
                <a href="index.html" class="flex items-center gap-2 group">
                    <div class="bg-green-600 p-1.5 rounded-lg text-white group-hover:bg-green-700 transition-colors">
                        <i data-lucide="zap" class="w-5 h-5 fill-current"></i>
                    </div>
                    <span class="font-bold text-lg tracking-tight">Zap<span class="text-green-600">Budget</span></span>
                </a>
            </div>

            <div class="flex items-center gap-8">
                <div class="hidden lg:flex items-center gap-6">
                    <a href="app.html" class="text-sm font-bold text-slate-500 hover:text-green-600 transition-colors flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Novo
                    </a>
                    <a href="historico.html" class="text-sm font-bold text-green-600 hover:text-green-700 transition-colors flex items-center gap-2">
                        <i data-lucide="history" class="w-4 h-4"></i> Histórico
                    </a>
                    <a href="perfil.html" class="text-sm font-bold text-slate-500 hover:text-green-600 transition-colors flex items-center gap-2">
                        <i data-lucide="user" class="w-4 h-4"></i> Perfil
                    </a>
                </div>
                <div class="hidden lg:block w-px h-6 bg-slate-200"></div>
                <div id="user-nav" class="flex items-center gap-4"></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8 lg:py-12">
        
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">Meus Orçamentos</h1>
                <p class="text-slate-500 font-medium">Gerencie suas propostas enviadas.</p>
            </div>
            <a href="app.html" class="bg-slate-900 text-white p-3 rounded-2xl shadow-lg hover:bg-slate-800 transition-all active:scale-95">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </a>
        </div>

        <div id="budget-list" class="space-y-4">
            <div class="skeleton h-32 w-full rounded-[24px]"></div>
            <div class="skeleton h-32 w-full rounded-[24px]"></div>
            <div class="skeleton h-32 w-full rounded-[24px]"></div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-500 pt-12 pb-24 lg:pb-12 mt-auto border-t border-white/5">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div class="flex items-center justify-center gap-2 mb-6">
                <i data-lucide="zap" class="w-5 h-5 text-green-500 fill-current"></i>
                <span class="font-black text-white text-xl uppercase italic">Zap<span class="text-green-600">Budget</span></span>
            </div>
            <p class="text-xs font-bold opacity-40 uppercase tracking-widest">© 2026 ZapBudget SaaS</p>
        </div>
    </footer>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 h-16 flex items-center justify-around z-[60] lg:hidden">
        <button onclick="location.href='app.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-green-600 transition-colors">
            <i data-lucide="plus-circle" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Novo</span>
        </button>
        <button onclick="window.location.href='historico.html'" class="flex flex-col items-center gap-1 text-green-600">
            <i data-lucide="history" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Histórico</span>
        </button>
        <button onclick="window.location.href='perfil.html'" class="flex flex-col items-center gap-1 text-slate-400 hover:text-green-600 transition-colors">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Perfil</span>
        </button>
    </div>

    <script>
        const SUPABASE_URL = "https://pxwsebtpmghhgbigkddx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lQh9j9TlA3-7S35jqFjefA_fh4sswez";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        lucide.createIcons();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            const icon = type === 'error' ? 'alert-circle' : 'check-circle';
            const color = type === 'error' ? 'text-red-500' : 'text-green-500';
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 ${color}"></i><span class="text-sm font-bold text-slate-700">${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.style.animation = 'toastOut 0.3s ease-in forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function updateStatus(id, newStatus) {
            // Feedback visual imediato "Salvando..."
            showToast("Atualizando status...", "normal");

            const { error } = await supabaseClient
                .from('orçamentos')
                .update({ status: newStatus })
                .eq('id', id);

            if (error) {
                console.error(error);
                showToast("Erro ao atualizar!", "error");
            } else {
                // Atualiza a cor visualmente
                const select = document.getElementById(`status-${id}`);
                const colors = {
                    'Pendente': 'text-slate-400',
                    'Enviado': 'text-blue-500',
                    'Aprovado': 'text-green-600',
                    'Recusado': 'text-red-500'
                };
                Object.values(colors).forEach(c => select.classList.remove(c));
                select.classList.add(colors[newStatus] || 'text-slate-400');
                showToast("Status salvo com sucesso!");
            }
        }

        async function deleteBudget(id) {
            if (!confirm("Tem certeza que deseja excluir este orçamento?")) return;

            const { error } = await supabaseClient
                .from('orçamentos')
                .delete()
                .eq('id', id);

            if (error) {
                console.error("Erro ao excluir:", error);
                showToast("Erro ao excluir.", "error");
            } else {
                showToast("Orçamento excluído!");
                // Remove o elemento da tela
                const el = document.getElementById(`card-${id}`);
                if (el) {
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300);
                }
                // Se ficou vazio, recarrega para mostrar msg de vazio
                setTimeout(() => {
                    const container = document.getElementById('budget-list');
                    if (container.children.length === 0) loadBudgets();
                }, 500);
            }
        }

        async function loadBudgets() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    window.location.replace("login.html");
                    return;
                }
                currentUser = session.user;
                
                // User Nav
                const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
                const initial = name.charAt(0).toUpperCase();
                document.getElementById('user-nav').innerHTML = `
                    <a href="perfil.html" class="h-10 w-10 bg-green-600 rounded-full flex items-center justify-center shadow-lg text-white font-bold text-lg border-2 border-white ring-2 ring-green-100 transition-transform hover:scale-105">
                        ${initial}
                    </a>
                `;

                // Carrega Orçamentos
                const container = document.getElementById('budget-list');
                const { data: budgets, error } = await supabaseClient
                    .from('orçamentos')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!budgets || budgets.length === 0) {
                    container.innerHTML = `
                        <div class='text-center py-20 opacity-40'>
                            <div class="bg-slate-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="file-x" class="w-10 h-10 text-slate-400"></i>
                            </div>
                            <p class="font-bold text-slate-500 text-lg">Nenhum orçamento encontrado.</p>
                            <a href="app.html" class="text-green-600 text-sm font-bold mt-2 inline-block hover:underline">Criar o primeiro</a>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                container.innerHTML = budgets.map(b => {
                    const status = b.status || 'Pendente';
                    const statusColors = {
                        'Pendente': 'text-slate-400',
                        'Enviado': 'text-blue-500',
                        'Aprovado': 'text-green-600',
                        'Recusado': 'text-red-500'
                    };
                    const date = new Date(b.created_at).toLocaleDateString('pt-BR');

                    return `
                    <div id="card-${b.id}" class="bg-white p-6 rounded-[24px] border border-slate-100 shadow-xl shadow-slate-50 hover:shadow-2xl transition-all flex flex-col gap-4 group relative overflow-hidden">
                        
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-4">
                                <div class="bg-green-50 w-12 h-12 rounded-2xl flex items-center justify-center text-green-600">
                                    <i data-lucide="file-text" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-900 text-lg leading-tight">${b.client_name || 'Sem nome'}</h3>
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">${date}</span>
                                </div>
                            </div>
                            
                            <div class="text-right">
                                <p class="text-lg font-black text-slate-900">${b.valor}</p>
                                <select id="status-${b.id}" onchange="updateStatus('${b.id}', this.value)" class="text-[10px] font-black uppercase tracking-widest bg-transparent border-none p-0 focus:ring-0 cursor-pointer ${statusColors[status]} transition-colors text-right dir-rtl outline-none">
                                    <option value="Pendente" ${status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                                    <option value="Enviado" ${status === 'Enviado' ? 'selected' : ''}>Enviado</option>
                                    <option value="Aprovado" ${status === 'Aprovado' ? 'selected' : ''}>Aprovado</option>
                                    <option value="Recusado" ${status === 'Recusado' ? 'selected' : ''}>Recusado</option>
                                </select>
                            </div>
                        </div>

                        <div class="h-px bg-slate-50 w-full"></div>

                        <div class="flex gap-2">
                            <button onclick="location.href='app.html?edit=${b.id}'" class="flex-1 h-10 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold text-xs uppercase tracking-wide flex items-center justify-center gap-2 transition-colors">
                                <i data-lucide="edit-3" class="w-4 h-4"></i> Editar
                            </button>
                            <a href="view.html?id=${b.id}" target="_blank" class="flex-1 h-10 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs uppercase tracking-wide flex items-center justify-center gap-2 transition-colors shadow-lg active:scale-95">
                                <i data-lucide="eye" class="w-4 h-4"></i> Ver
                            </a>
                            <button onclick="deleteBudget('${b.id}')" class="h-10 w-10 rounded-xl bg-red-50 hover:bg-red-100 text-red-500 flex items-center justify-center transition-colors" title="Excluir">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>

                    </div>`;
                }).join('');
                lucide.createIcons();

            } catch (error) {
                console.error("Erro ao carregar orçamentos:", error);
                document.getElementById('budget-list').innerHTML = `<p class="text-center text-red-500 font-bold">Erro ao carregar dados.</p>`;
            }
        }

        // Inicializar
        loadBudgets();
    </script>
</body>
</html>
