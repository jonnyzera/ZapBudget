<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Proposta Comercial - ZapBudget</title>
    <link rel="icon" type="image/png" href="/img/favicon (3).png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            color-scheme: light;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc; /* Fundo levemente off-white para contraste com o papel */
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Padrão de fundo técnico */
        .bg-pattern {
            background-color: #ffffff;
            background-image: radial-gradient(#e2e8f0 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }

        .paper {
            background: white;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08); /* Sombra mais elegante */
            width: 100%;
            max-width: 800px;
            margin: 2rem auto;
            border-radius: 2px; /* Cantos levemente arredondados */
            overflow: hidden;
        }

        /* Faixa superior colorida */
        .paper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #22c55e, #16a34a);
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .paper { 
                box-shadow: none; 
                margin: 0; 
                width: 100%; 
                max-width: 100%;
                border: none; 
                border-radius: 0; 
            }
            .bg-pattern { background: white; }
        }

        /* Animação de Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-pattern p-4 sm:p-8">

    <!-- Header Flutuante -->
    <div class="max-w-[800px] w-full mx-auto mb-6 flex justify-between items-center no-print">
        <a href="index.html" class="flex items-center gap-2 group">
            <div class="bg-green-600 p-1.5 rounded-lg text-white shadow-lg shadow-green-100 transition-transform group-hover:scale-105">
                <i data-lucide="zap" class="w-4 h-4 fill-current"></i>
            </div>
            <span class="font-bold text-base text-slate-900 tracking-tight">Zap<span class="text-green-600">Budget</span></span>
        </a>
        <button onclick="window.print()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg shadow-slate-200 active:scale-95 transition-all">
            <i data-lucide="printer" class="w-4 h-4 text-green-400"></i> Imprimir / PDF
        </button>
    </div>

    <!-- Loader Skeleton -->
    <div id="loader" class="max-w-[800px] w-full mx-auto bg-white p-8 sm:p-16 rounded-sm shadow-xl space-y-8">
        <div class="flex justify-between">
            <div class="space-y-2 w-1/2">
                <div class="skeleton h-10 w-3/4"></div>
                <div class="skeleton h-6 w-1/3"></div>
            </div>
            <div class="skeleton h-10 w-20"></div>
        </div>
        <div class="skeleton h-24 w-full rounded-xl"></div>
        <div class="space-y-4">
            <div class="skeleton h-4 w-full"></div>
            <div class="skeleton h-4 w-full"></div>
            <div class="skeleton h-4 w-2/3"></div>
        </div>
    </div>

    <!-- Documento Real -->
    <div id="content" class="paper hidden flex-grow">
        <div class="p-8 sm:p-16 min-h-[800px] flex flex-col justify-between">
            
            <!-- Parte Superior -->
            <div>
                <!-- Cabeçalho do Orçamento -->
                <div class="flex flex-col sm:flex-row justify-between items-start gap-8 mb-12">
                    <div class="space-y-2">
                        <h2 id="viewVendor" class="text-3xl sm:text-4xl font-black text-slate-900 uppercase tracking-tighter leading-none break-words">---</h2>
                        <div class="inline-flex items-center gap-1 bg-slate-900 text-white text-[10px] font-black px-2 py-1 uppercase tracking-[0.1em] rounded-md">
                            <i data-lucide="file-check" class="w-3 h-3"></i> Proposta Comercial
                        </div>
                    </div>
                    <div class="text-left sm:text-right border-l-4 sm:border-l-0 sm:border-r-4 border-slate-100 pl-4 sm:pl-0 sm:pr-4">
                        <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-1">Data de Emissão</p>
                        <p id="viewDate" class="text-sm font-bold text-slate-800">--/--/----</p>
                    </div>
                </div>

                <!-- Cliente Destacado -->
                <div class="mb-12 border-l-[6px] border-green-500 bg-slate-50 p-6 sm:p-8 rounded-r-2xl">
                    <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-2 flex items-center gap-2">
                        <i data-lucide="user" class="w-3 h-3"></i> Apresentado para:
                    </p>
                    <h3 id="viewClient" class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight break-words">---</h3>
                </div>

                <!-- Descrição dos Serviços -->
                <div class="space-y-8">
                    <div class="space-y-4">
                        <div class="flex items-center gap-3 border-b border-slate-100 pb-2">
                            <i data-lucide="briefcase" class="w-4 h-4 text-green-600"></i>
                            <h4 class="text-[10px] text-slate-500 font-black uppercase tracking-[0.2em]">Descrição dos Serviços</h4>
                        </div>
                        <div id="viewService" class="text-slate-700 text-sm sm:text-base whitespace-pre-wrap leading-relaxed min-h-[120px] font-medium pl-2 border-l-2 border-slate-100">
                            ---
                        </div>
                    </div>
                    
                    <!-- Grid de Detalhes -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-6 border-t border-slate-100">
                        <div class="flex items-start gap-3 bg-slate-50 p-4 rounded-xl">
                            <div class="bg-white p-2 rounded-lg text-slate-400 shadow-sm">
                                <i data-lucide="calendar-clock" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <p class="text-[9px] text-slate-400 font-black uppercase tracking-widest mb-0.5">Prazo Estimado</p>
                                <p id="viewDelivery" class="text-sm font-bold text-slate-800">---</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-3 bg-slate-50 p-4 rounded-xl">
                            <div class="bg-white p-2 rounded-lg text-slate-400 shadow-sm">
                                <i data-lucide="wallet" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <p class="text-[9px] text-slate-400 font-black uppercase tracking-widest mb-0.5">Condição de Pagamento</p>
                                <p id="viewPayment" class="text-sm font-bold text-slate-800">---</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Rodapé / Totais -->
            <div class="mt-16">
                <!-- Total Section -->
                <div class="pt-8 border-t-4 border-slate-900 flex flex-col sm:flex-row justify-between items-end gap-6">
                    <div id="viewExpiryContainer" class="hidden bg-red-50 text-red-600 px-4 py-2 rounded-full flex items-center gap-2">
                        <i data-lucide="alert-circle" class="w-4 h-4"></i>
                        <p id="viewExpiry" class="text-[10px] font-black uppercase tracking-widest"></p>
                    </div>
                    <div id="emptyExpiry" class="flex-1"></div> <!-- Spacer se não tiver validade -->

                    <div class="text-right w-full sm:w-auto">
                        <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-1">Investimento Total</p>
                        <p id="viewPrice" class="text-4xl sm:text-6xl font-black text-slate-900 tracking-tighter leading-none">R$ 0,00</p>
                    </div>
                </div>
                
                <!-- Assinatura -->
                <div class="mt-16 pt-8 border-t border-slate-100 text-center">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-4">Atenciosamente,</p>
                    <p id="viewVendorSignature" class="text-lg font-black text-slate-900 uppercase italic tracking-tight mb-2"></p>
                    <div class="w-16 h-1.5 bg-green-500 mx-auto rounded-full mb-6"></div>
                    
                    <div class="flex items-center justify-center gap-2 opacity-30">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                        <p class="text-[9px] font-black uppercase tracking-[0.3em]">Documento Oficial ZapBudget</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Seguro -->
    <div class="max-w-[800px] w-full mx-auto mt-8 pb-8 text-center no-print">
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center justify-center gap-2 bg-white/50 py-2 rounded-full mx-auto w-fit px-6 backdrop-blur-sm">
            <i data-lucide="lock" class="w-3 h-3 text-green-600"></i>
            Link de visualização segura
        </p>
    </div>

    <script>
        lucide.createIcons();
        const API_URL = window.location.origin + "/api";

        async function carregarOrcamento() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                document.getElementById('loader').innerHTML = `
                    <div class="text-center py-20 bg-white rounded-xl shadow-lg">
                        <div class="bg-red-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="link-2-off" class="w-8 h-8 text-red-500"></i>
                        </div>
                        <h2 class="text-xl font-black text-slate-900 mb-2">Link Inválido</h2>
                        <p class="text-slate-500 text-sm font-medium">Não foi possível encontrar o orçamento solicitado.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            try {
                const response = await fetch(`${API_URL}/orcamentos/${id}`);
                if (!response.ok) throw new Error();
                
                const data = await response.json();

                // Preencher dados
                document.getElementById('viewVendor').innerText = data.vendor_name || 'EMPRESA';
                document.getElementById('viewVendorSignature').innerText = data.vendor_name || 'EMPRESA';
                document.getElementById('viewClient').innerText = data.client_name || 'Cliente';
                document.getElementById('viewService').innerText = data.servicos || 'Serviços não descritos.';
                document.getElementById('viewPrice').innerText = data.valor || 'R$ 0,00';
                document.getElementById('viewDelivery').innerText = data.prazo || 'A combinar';
                document.getElementById('viewPayment').innerText = data.pagamento || 'A combinar';
                
                // Formatar data de criação
                const date = new Date(data.created_at);
                document.getElementById('viewDate').innerText = date.toLocaleDateString('pt-BR');

                // Validade
                if (data.validade) {
                    const [ano, mes, dia] = data.validade.split('-');
                    document.getElementById('viewExpiry').innerText = `VÁLIDO ATÉ: ${dia}/${mes}/${ano}`;
                    document.getElementById('viewExpiryContainer').classList.remove('hidden');
                }

                // Mostrar conteúdo
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                lucide.createIcons();

            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = `
                    <div class="text-center py-20 bg-white rounded-xl shadow-lg">
                        <div class="bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="file-x" class="w-8 h-8 text-slate-400"></i>
                        </div>
                        <h2 class="text-xl font-black text-slate-900 mb-2">Orçamento não encontrado</h2>
                        <p class="text-slate-500 text-sm font-medium">Este documento pode ter sido removido ou não existe.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        carregarOrcamento();
    </script>
</body>
</html>
