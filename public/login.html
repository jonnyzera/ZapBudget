<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar - ZapBudget</title>
    <link rel="icon" type="image/png" href="./img/favicon (3).png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root { color-scheme: light; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff !important;
            color: #0f172a !important;
            -webkit-tap-highlight-color: transparent;
        }

        input:focus, select:focus, textarea:focus { font-size: 16px !important; }
        
        input:focus {
            outline: none; border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }
        
        button { min-height: 56px; }

        .auth-card { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .google-btn {
            background: white; border: 1px solid #e2e8f0; color: #1e293b; transition: all 0.2s;
        }
        .google-btn:hover { background: #f8fafc; border-color: #cbd5e1; }

        /* TOAST STYLES */
        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: 90%; max-width: 400px; pointer-events: none;
        }
        .toast {
            background: white; padding: 16px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
            animation: toastIn 0.3s ease-out forwards; pointer-events: auto;
            border-left: 4px solid #16a34a;
        }
        .toast.error { border-left-color: #ef4444; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center p-6 sm:p-12">

    <div id="toast-container"></div>

    <a href="index.html" class="absolute top-6 left-6 flex items-center gap-2 text-sm font-bold text-slate-400 hover:text-slate-900 transition-all group z-10">
        <div class="bg-slate-50 p-2 rounded-full group-hover:bg-slate-100 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i> 
        </div>
    </a>

    <div class="w-full max-w-md space-y-8 auth-card relative">
        <div class="text-center">
            <div class="flex items-center justify-center gap-2 mb-6">
                <div class="bg-green-600 p-2 rounded-xl text-white shadow-lg shadow-green-100">
                    <i data-lucide="zap" class="w-6 h-6 fill-current"></i>
                </div>
                <span class="font-black text-2xl tracking-tight text-slate-900 italic">Zap<span class="text-green-600">Budget</span></span>
            </div>
            <h2 id="auth-title" class="text-3xl font-black text-slate-900 tracking-tight uppercase">Acesse sua Conta</h2>
            <p id="auth-subtitle" class="text-slate-500 mt-2 font-medium px-4">Entre para gerenciar seus orçamentos e profissionalizar seu negócio.</p>
        </div>

        <div class="bg-white p-6 sm:p-10 rounded-[40px] border border-slate-100 shadow-2xl shadow-slate-200/50">
            
            <button onclick="handleGoogleLogin()" class="w-full google-btn font-bold py-4 rounded-2xl flex items-center justify-center gap-3 mb-6 active:scale-95 transition-all">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continuar com Google
            </button>

            <div class="relative flex items-center gap-4 mb-6">
                <div class="flex-1 h-px bg-slate-100"></div>
                <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">ou manual</span>
                <div class="flex-1 h-px bg-slate-100"></div>
            </div>

            <div class="flex bg-slate-50 p-1.5 rounded-2xl mb-6">
                <button onclick="toggleAuthMode('login')" id="btn-tab-login" class="flex-1 py-3 text-xs font-bold rounded-xl bg-white shadow-sm transition-all text-slate-900">Entrar</button>
                <button onclick="toggleAuthMode('signup')" id="btn-tab-signup" class="flex-1 py-3 text-xs font-bold text-slate-400 transition-all hover:text-slate-600">Cadastrar</button>
            </div>

            <form onsubmit="handleAuth(event)" class="space-y-5">
                <div id="signup-fields" class="hidden space-y-5">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Nome Completo</label>
                        <input type="text" id="auth-name" placeholder="Ex: João Silva" class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 font-bold text-sm focus:bg-white transition-colors">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">CPF (Apenas números)</label>
                        <input type="text" id="auth-cpf" maxlength="11" placeholder="00000000000" class="w-full p-4 rounded-xl border border-slate-200 bg-slate-50 font-bold text-sm focus:bg-white transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Seu E-mail</label>
                    <input type="email" id="auth-email" required placeholder="exemplo@gmail.com" class="w-full p-4 rounded-2xl border border-slate-200 bg-slate-50 font-bold text-slate-700 transition-all text-sm sm:text-base">
                </div>

                <div class="grid grid-cols-1 gap-5">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Sua Senha</label>
                        <input type="password" id="auth-password" required placeholder="••••••••" class="w-full p-4 rounded-2xl border border-slate-200 bg-slate-50 font-bold text-slate-700 transition-all text-sm sm:text-base">
                    </div>
                    <div id="confirm-pass-field" class="hidden">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Confirmar Senha</label>
                        <input type="password" id="auth-confirm-password" placeholder="••••••••" class="w-full p-4 rounded-2xl border border-slate-200 bg-slate-50 font-bold text-slate-700 transition-all text-sm sm:text-base">
                    </div>
                </div>

                <button type="submit" id="auth-btn" class="w-full bg-green-600 text-white font-black py-4 rounded-2xl text-lg hover:bg-green-700 transition-all shadow-xl shadow-green-100 active:scale-95 flex items-center justify-center gap-2 mt-4">
                    ENTRAR NO SISTEMA
                </button>
            </form>
        </div>
        
        <div class="text-center">
            <p class="text-[10px] font-black tracking-[0.3em] uppercase opacity-20 text-slate-900">
                Segurança Garantida ZapBudget
            </p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://pxwsebtpmghhgbigkddx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lQh9j9TlA3-7S35jqFjefA_fh4sswez";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let authMode = 'login';
        lucide.createIcons();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            const icon = type === 'error' ? 'alert-circle' : 'check-circle';
            const color = type === 'error' ? 'text-red-500' : 'text-green-500';
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 ${color}"></i><span class="text-sm font-bold text-slate-700">${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { 
                toast.style.animation = 'toastOut 0.3s ease-in forwards'; 
                setTimeout(() => toast.remove(), 300); 
            }, 4000);
        }

        function toggleAuthMode(mode) {
            authMode = mode;
            const signupFields = document.getElementById('signup-fields');
            const confirmPass = document.getElementById('confirm-pass-field');
            const btnText = document.getElementById('auth-btn');
            const title = document.getElementById('auth-title');
            
            const tabLogin = document.getElementById('btn-tab-login');
            const tabSignup = document.getElementById('btn-tab-signup');

            btnText.innerHTML = mode === 'signup' ? "CRIAR CONTA GRÁTIS" : "ENTRAR NO SISTEMA";

            if (mode === 'signup') {
                signupFields.classList.remove('hidden');
                confirmPass.classList.remove('hidden');
                title.innerText = "Criar Nova Conta";
                tabSignup.classList.add('bg-white', 'shadow-sm', 'text-slate-900');
                tabSignup.classList.remove('text-slate-400');
                tabLogin.classList.remove('bg-white', 'shadow-sm', 'text-slate-900');
                tabLogin.classList.add('text-slate-400');
            } else {
                signupFields.classList.add('hidden');
                confirmPass.classList.add('hidden');
                title.innerText = "Acesse sua Conta";
                tabLogin.classList.add('bg-white', 'shadow-sm', 'text-slate-900');
                tabLogin.classList.remove('text-slate-400');
                tabSignup.classList.remove('bg-white', 'shadow-sm', 'text-slate-900');
                tabSignup.classList.add('text-slate-400');
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById('auth-btn');
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> PROCESSANDO...`;
            lucide.createIcons();

            try {
                if (authMode === 'signup') {
                    const name = document.getElementById('auth-name').value;
                    const cpf = document.getElementById('auth-cpf').value;
                    const confirmPass = document.getElementById('auth-confirm-password').value;

                    if (!name || !cpf) throw new Error("Preencha nome e CPF.");
                    if (password !== confirmPass) throw new Error("As senhas não coincidem.");

                    const response = await fetch('/api/auth/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, cpf, password })
                    });
                    const data = await response.json();

                    if (!response.ok) throw new Error(data.detail || "Erro ao criar conta.");
                    
                    showToast("Conta criada! Redirecionando para login...");
                    setTimeout(() => toggleAuthMode('login'), 2000); 

                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;

                    if (data.user) {
                        const provider = data.user.app_metadata.provider || 'email';
                        await supabaseClient.from('profiles').upsert({
                            id: data.user.id, provider, trial_start: new Date().toISOString()
                        }, { onConflict: 'id' });
                        
                        btn.classList.replace('bg-green-600', 'bg-slate-900');
                        btn.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> SUCESSO!`;
                        lucide.createIcons();
                        setTimeout(() => { window.location.href = "app.html"; }, 800);
                        return; 
                    }
                }
            } catch (err) {
                console.error("Auth Error:", err);
                // Exibe o erro de forma bonita no topo
                showToast(err.message, "error");
            } finally {
                if (!btn.innerHTML.includes("SUCESSO")) {
                    btn.disabled = false;
                    btn.innerHTML = authMode === 'signup' ? "CRIAR CONTA GRÁTIS" : "ENTRAR NO SISTEMA";
                }
            }
        }

        async function handleGoogleLogin() {
            try {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin + '/app.html' }
                });
                if (error) throw error;
            } catch (err) {
                showToast("Erro Google: " + err.message, "error");
            }
        }
    </script>
</body>
</html>
